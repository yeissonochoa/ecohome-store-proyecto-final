name: ecohome_connect_mobile
description: >
  App móvil de EcoHome Store (Flutter) - Caso Práctico Unidad 3.
  Reutiliza exactamente el mismo backend Express/Socket.IO que la app
  web en React: login con JWT, catálogo de productos con trazabilidad
  del creador, y chat interno en tiempo real.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Cliente HTTP para /auth, /products, /users/me/stats
  http: ^1.2.1

  # Cliente de Socket.IO, compatible con el servidor socket.io v4 del backend
  socket_io_client: ^2.0.3+1

  # Gestión de estado simple (sesión, catálogo) vía ChangeNotifier
  provider: ^6.1.2

  # Persistencia local del JWT (equivalente a localStorage en React)
  shared_preferences: ^2.2.3

  # Formateo de fechas (timestamps de mensajes y productos)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
